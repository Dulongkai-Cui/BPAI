<style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);

            -webkit-backdrop-filter: blur(16px);

        .hex-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(59, 130, 246, 0.15) 1px, transparent 0);
            background-size: 32px 32px;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #60a5fa, transparent);
            width: 100%;
            position: absolute;
            z-index: 10;
            opacity: 0.3;
        }

<body class="bg-blue-950 font-body m-0 p-0 min-h-screen flex items-center justify-center overflow-hidden">
<!-- Background Layer: Low Poly City Map -->
<div class="fixed inset-0 z-0 overflow-hidden">
<img alt="City Map Background" class="w-full h-full object-cover opacity-40 scale-105 blur-sm" data-alt="abstract low-poly 3D wireframe city map in deep navy blue tones with glowing data nodes and cyan light trails" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAnV3kMD3KvH_RVRnqde5H40Z6v8aF8l823GdGgxNScIyUYQfmtxhOWKqbYYfHfqgAVxcUYLG1-WElDpPzj6zC2MoG8_lJAs7VUwD3FnE8ems8z29zn8Q-529DQzEF4a-5OOdcQRoDs5PlnAJIs5wtZqePsTYMxb5XB3bgtEHxsJZv7EQQLD60l_tid5fVxXniGU3Lrk7GNBHt15OtnZd0VttG5Anhrt7JxI2OlmPI5RPbBvUZAIQQDMOywZdhRvWUk53gMH0Icg"/>

<div class="absolute inset-0 hex-grid"></div>
</div>
<!-- Scanning Line Effect Overlay -->
<div class="fixed inset-0 pointer-events-none z-10">
<div class="scan-line top-1/4"></div>
<div class="scan-line top-3/4"></div>
</div>
<!-- Main Login Canvas -->
<main class="relative z-20 w-full max-w-md px-6">
<!-- Header Brand Indicator (Suppressed Nav Shell as per instructions) -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 rounded-xl bg-primary flex items-center justify-center mb-4 shadow-[0_0_30px_rgba(42,94,167,0.5)] border border-blue-400/30">
<span class="material-symbols-outlined text-white text-4xl" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</div>
<h1 class="text-white text-2xl font-black tracking-[0.2em] uppercase">电信工程BPAI</h1>
</div>
<!-- Glassmorphism Card -->
<div class="glass-panel rounded-2xl p-8 border-t border-blue-400/30">
<!-- Form Title Section -->
<div class="mb-8 text-center">
<h2 class="text-blue-400 font-headline text-2xl font-bold tracking-wider mb-1">电信工程BPAI 系统登录</h2>
<p class="text-slate-400 text-xs tracking-widest uppercase font-semibold">电信工程BPAI v1.0</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6">
<!-- Username Input -->
<div class="space-y-2">
<label class="block text-slate-300 text-xs font-bold uppercase tracking-tighter" for="username">用户名</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 group-focus-within:text-blue-400 transition-colors" data-icon="person">person</span>
</div>
<input class="w-full bg-slate-900/50 border-slate-700/50 text-white pl-12 pr-4 py-3 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600" id="username" placeholder="COMMAND_OFFICER_01" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-slate-300 text-xs font-bold uppercase tracking-tighter" for="password">密码</label>
<a class="text-[10px] text-blue-500 hover:text-blue-400 transition-colors uppercase font-bold" href="#">忘记密钥?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 group-focus-within:text-blue-400 transition-colors" data-icon="key">key</span>
</div>
<input class="w-full bg-slate-900/50 border-slate-700/50 text-white pl-12 pr-4 py-3 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-blue-600 text-white font-black py-4 rounded-lg shadow-[0_4px_20px_rgba(42,94,167,0.4)] transition-all active:scale-[0.98] uppercase tracking-widest text-sm flex items-center justify-center gap-2 group" type="submit">
                    进入指挥中心
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Status Indicator -->
<div class="mt-8 pt-6 border-t border-slate-800 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
</div>
<span class="text-slate-400 text-[10px] font-bold tracking-widest uppercase">正在验证身份...</span>
</div>
<div class="text-slate-500 text-[10px] font-mono">
                    IP: 192.168.1.144
                </div>
</div>

<footer class="mt-12 flex justify-between items-center px-4">

<div class="w-1 h-3 bg-blue-500"></div>
<div class="w-1 h-3 bg-blue-500"></div>
<div class="w-1 h-3 bg-blue-500"></div>
<div class="w-1 h-3 bg-blue-500/30"></div>
</div>
</div>

</div>
<div class="text-right">
