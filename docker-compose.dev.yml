services:
  frontend-dev:
    image: node:20-alpine
    container_name: bpai-front-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_ONLYOFFICE_SERVER_URL: "http://localhost:8080"
      NEXT_PUBLIC_ONLYOFFICE_CALLBACK_URL: "http://bpai-front-dev:3000/api/onlyoffice/callback"
      NEXT_PUBLIC_ONLYOFFICE_FILE_BASE_URL: "http://bpai-front-dev:3000"
      ONLYOFFICE_INTERNAL_BASE_URL: "http://bpai-onlyoffice"
    ports:
      - "${FRONTEND_DEV_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:latest
    container_name: bpai-onlyoffice
    environment:
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    ports:
      - "8080:80"
