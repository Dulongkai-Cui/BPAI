services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bpai-postgres
    environment:
      POSTGRES_DB: bpai_dev
      POSTGRES_USER: bpai
      POSTGRES_PASSWORD: bpai
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bpai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpai -d bpai_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend-dev:
    image: node:20-alpine
    container_name: bpai-front-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_ONLYOFFICE_SERVER_URL: "http://localhost:8080"
      NEXT_PUBLIC_ONLYOFFICE_CALLBACK_URL: "http://bpai-front-dev:3000/api/onlyoffice/callback"
      NEXT_PUBLIC_ONLYOFFICE_FILE_BASE_URL: "http://bpai-front-dev:3000"
      ONLYOFFICE_INTERNAL_BASE_URL: "http://bpai-onlyoffice"
      DATABASE_URL: "postgresql://bpai:bpai@postgres:5432/bpai_dev"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:-bpai-sidecar-openclaw-token}"
      OPENCLAW_CONSOLE_URL: "http://127.0.0.1:${OPENCLAW_PORT:-18889}/"
      OPENCLAW_WORK_ORDER_GATEWAY_TOKEN: "${OPENCLAW_WORK_ORDER_GATEWAY_TOKEN:-bpai-sidecar-openclaw-token}"
      OPENCLAW_WORK_ORDER_CONSOLE_URL: "http://127.0.0.1:${OPENCLAW_PORT:-18889}/"
      OPENCLAW_DOCUMENT_GATEWAY_TOKEN: "${OPENCLAW_DOCUMENT_GATEWAY_TOKEN:-bpai-document-openclaw-token}"
      OPENCLAW_DOCUMENT_CONSOLE_URL: "http://127.0.0.1:${OPENCLAW_DOCUMENT_PORT:-18989}/"
      OPENCLAW_DRAWING_GATEWAY_TOKEN: "${OPENCLAW_DRAWING_GATEWAY_TOKEN:-bpai-drawing-openclaw-token}"
      OPENCLAW_DRAWING_CONSOLE_URL: "http://127.0.0.1:${OPENCLAW_DRAWING_PORT:-19089}/"
      OPENCLAW_ALERT_GATEWAY_TOKEN: "${OPENCLAW_ALERT_GATEWAY_TOKEN:-bpai-alert-openclaw-token}"
      OPENCLAW_ALERT_CONSOLE_URL: "http://127.0.0.1:${OPENCLAW_ALERT_PORT:-19189}/"
      OPENCLAW_REPORT_GATEWAY_TOKEN: "${OPENCLAW_REPORT_GATEWAY_TOKEN:-bpai-report-openclaw-token}"
      OPENCLAW_REPORT_CONSOLE_URL: "http://127.0.0.1:${OPENCLAW_REPORT_PORT:-19289}/"
    ports:
      - "${FRONTEND_DEV_PORT:-3001}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice-documentserver:
        condition: service_healthy
    command: sh -c "npm install && npm run db:migrate && npm run dev -- --hostname 0.0.0.0 --port 3000"

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:latest
    container_name: bpai-onlyoffice
    environment:
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthcheck >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: bpai-openclaw
    profiles:
      - openclaw
    env_file:
      - ./docker/openclaw/state/.env
    environment:
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:-bpai-sidecar-openclaw-token}"
    entrypoint: ["node"]
    command:
      - openclaw.mjs
      - gateway
      - run
      - --allow-unconfigured
      - --auth
      - token
      - --token
      - ${OPENCLAW_GATEWAY_TOKEN:-bpai-sidecar-openclaw-token}
      - --bind
      - lan
      - --port
      - "18789"
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18889}:18789"
    volumes:
      - ./docker/openclaw/state:/home/node/.openclaw
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  openclaw-document:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: bpai-openclaw-document
    profiles:
      - openclaw
    env_file:
      - ./docker/openclaw/state/.env
    environment:
