      - --port
      - "18789"
    ports:
      - "127.0.0.1:${OPENCLAW_DRAWING_PORT:-19089}:18789"
    volumes:
      - ./docker/openclaw/state-drawing:/home/node/.openclaw
    healthcheck:
      test:
        [
          "CMD",
